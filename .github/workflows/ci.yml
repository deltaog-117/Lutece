name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Xvfb is the headless X server the integration tests run the window manager on.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb
      - name: Check
        run: scripts/ci
