[package]
name = "lutece-wayland"
description = "Wayland backend for lutece"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
lutece = { path = "../lutece" }
rustix = { version = "1", features = ["event"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "renderer_gl", "wayland_frontend", "desktop"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
