[package]
name = "lutece-wayland"
description = "Wayland backend for lutece"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Not the workspace table: one call into EGL has no safe wrapper, so `unsafe_code` is
# `deny` here, and allowed only on that one call in `nested.rs`. Other crates stay `forbid`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
lutece = { path = "../lutece" }
rustix = { version = "1", features = ["event"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat", "renderer_gl", "renderer_multi", "wayland_frontend", "desktop", "xwayland"] }
thiserror = "2"
# A second connection to Xwayland, for the window state Smithay does not read.
x11rb = "0.14"

[dev-dependencies]
proptest = "1"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
