[package]
name = "lutece-x11"
description = "X11 backend for lutece"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
lutece = { path = "../lutece" }
thiserror = "2"
x11rb = { version = "0.14", features = ["randr"] }

[dev-dependencies]
proptest = "1"
# XTEST lets the integration tests press keys the way a keyboard would.
x11rb = { version = "0.14", features = ["xtest"] }
