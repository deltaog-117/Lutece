[package]
name = "lutece-x11"
description = "X11 backend for lutece"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
lutece = { path = "../lutece" }
thiserror = "2"
x11rb = { version = "0.14", features = ["randr"] }
# Waiting on the X connection with a timeout, so a host that also serves a socket can look
# at it between X events. x11rb already depends on it.
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
proptest = "1"
# XTEST lets the integration tests press keys the way a keyboard would.
x11rb = { version = "0.14", features = ["xtest"] }
